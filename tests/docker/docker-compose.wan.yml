name: medtech-wan

services:
  nodes-image:
    image: medtech-wan-lab:local
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
      target: wan-lab
    network_mode: none
    entrypoint: ["/bin/true"]

  lab:
    image: ghcr.io/srl-labs/clab:0.83.0
    depends_on:
      nodes-image:
        condition: service_completed_successfully
    privileged: true
    network_mode: host
    pid: host
    stop_grace_period: 2m
    environment:
      WAN_LAB_ROOT: ${PWD:?Run from the repository root}
      RTI_LICENSE_FILE: ${RTI_LICENSE_FILE:?Set RTI_LICENSE_FILE to an absolute license path}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ${PWD:?Run from the repository root}:${PWD:?Run from the repository root}
      - ${RTI_LICENSE_FILE:?Set RTI_LICENSE_FILE to an absolute license path}:${RTI_LICENSE_FILE:?Set RTI_LICENSE_FILE to an absolute license path}:ro
    working_dir: ${PWD:?Run from the repository root}
    entrypoint: ["/bin/bash", "${PWD:?Run from the repository root}/tests/docker/wan-lab.sh"]
    command: ["run"]
    healthcheck:
      test: ["CMD", "/bin/bash", "${PWD:?Run from the repository root}/tests/docker/wan-lab.sh", "ready"]
      interval: 2s
      timeout: 10s
      retries: 30
