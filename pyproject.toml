[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rti-medtech-reference-architecture"
version = "2.0.0.dev0"
description = "RTI Connext DDS MedTech Reference Architecture"
requires-python = ">=3.11,<3.15"
dependencies = [
    "argcomplete>=3.1",
    "Jinja2>=3.1",
    "pystun3>=2.0",
    "requests>=2.31",
    "rti.connext==7.7.0",
    "rti-demo-ui @ git+https://github.com/wcoleman-rti/rti-demo-ui.git@309cb0ccb377ec4a70c0aaf3be8de5fcb1d4ec5a",
]

[project.optional-dependencies]
arm = [
    "mink==1.4.0",
    "mujoco==3.10.0",
    "qpsolvers[daqp]==4.13.0",
]
gamepad = ["pygame-ce>=2.5.8,<3"]
native = [
    "rti-demo-ui-native @ git+https://github.com/wcoleman-rti/rti-demo-ui.git@309cb0ccb377ec4a70c0aaf3be8de5fcb1d4ec5a#subdirectory=native/python",
]
user = ["rti-medtech-reference-architecture[arm,gamepad]"]
dev = [
    "rti-medtech-reference-architecture[user]",
    "playwright>=1.56,<2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
maint = [
    "rti-medtech-reference-architecture[dev]",
    "codespell>=2.4",
    "pre-commit>=3.0",
    "ruff>=0.15",
    "rumdl>=0.1.84",
    "uv==0.13.8",
]

[tool.setuptools]
packages = []

[tool.ruff]
required-version = ">=0.15"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.codespell]
# Keep spelling checks focused on source/docs and skip generated/cache content.
skip = ".git,.venv,.venv*,build,**/build,.pytest_cache,__pycache__,resource/images,*.svg"
ignore-words-list = "nddshome,connextdds,rtisetenv,dpqoslib,unsecure"
check-hidden = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "system/tests",
    "modules/01-operating-room/tests",
    "modules/02-record-playback/tests",
    "modules/04-security-threat/tests",
]
markers = [
    "build_pipeline: tests that verify project-level configure/build pipeline",
    "browser: test requires Playwright and a browser",
    "gui: test requires a graphical display (deselect with '-m not gui')",
    "secure: test requires DDS Security artifacts (deselect with '-m not secure')",
    "service: test requires RTI Recording/Replay Service (deselect with '-m not service')",
    "slow: long-running scenario (deselect with '-m not slow')",
]
addopts = "-rs"

[tool.rumdl]
disable = ["MD013"]

[tool.rumdl.MD024]
siblings-only = true

[tool.rumdl.MD033]
allowed-elements = ["details", "summary", "strong"]

[tool.rumdl.MD060]
style = "compact"
