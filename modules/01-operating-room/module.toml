description = "Digital Operating Room"

[env]
NDDS_QOS_PROFILES = "system/qos/Qos.xml;${args:security};system/qos/ApplicationFactoryQos.xml;system/model/DomainLibrary.xml;system/model/ParticipantLibrary.xml"

[args.security]
true = "system/qos/SecureAppsQos.xml"
false = "system/qos/NonSecureAppsQos.xml"

[app_variants.Arm]
default = "simulated"
choices = { simulated = "Arm", kortex = "ArmKortex" }

[app_variants.ArmController]
default = "simulated"

[app_variants.ArmController.choices]
simulated = "ArmController"
xbox = "ArmControllerGamepad"
falcon = "ArmControllerFalcon"

[apps]
ArmController = ["${CPP:ArmController}"]
ArmControllerGamepad = ["${PYTHON:ArmControllerGamepad}"]
ArmControllerFalcon = ["${PYTHON:ArmControllerFalcon}"]
Orchestrator = ["${CPP:Orchestrator}"]
PatientSensor = ["${CPP:PatientSensor}"]
Arm = ["${PYTHON:Arm}"]
ArmKortex = ["${PYTHON:ArmKortex}"]
PatientMonitor = ["${PYTHON:PatientMonitor}"]
