<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator — Digital Operating Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <img class="logo" src="../../../resource/images/rti_logo.png" alt="RTI" onerror="this.style.display='none'">
    <span class="brand">RTI</span>
    <span class="sep">|</span>
    <span class="title">Orchestrator</span>
    <span id="security-indicator"></span>
</header>

<main>
    <section class="devices" id="devices"></section>

    <section class="commands">
        <h2>COMMANDS</h2>
        <div>Selected device: <strong id="selected-device">—</strong></div>
        <button id="btn-start" disabled>Start</button>
        <button id="btn-pause" disabled>Pause</button>
        <button id="btn-off" disabled>Shut Down</button>
    </section>

    <section id="alerts"></section>
</main>

<script src="app.js"></script>
</body>
</html>
