name: Documentation

on:
  push:
    branches: [integration/v2]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy the reviewed docs to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/site/requirements.txt
      - run: python -m unittest discover -s tests -p test_docs_site.py
      - run: python docs/site/build.py .medtech/site --ref "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: .medtech/site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
        with:
          path: .medtech/site

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
