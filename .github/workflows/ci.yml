# CI pipeline for RTI MedTech Reference Architecture
#
# Uses GitHub-hosted Ubuntu runners with RTI Connext installed via apt.
# The RTI license file must be stored as a repository secret named
# RTI_LICENSE_FILE (base64-encoded contents of rti_license.dat).
#
# Connext installation is cached across runs to avoid repeated downloads.

name: CI

on:
  push:
    branches: [main, develop, integration/v2]
    tags: ["v*"]
  pull_request:
    branches: [main, develop, integration/v2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONNEXT_VERSION: "7.7.0"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure

  # ── License-free pull-request checks ─────────────────────────────────────
  test:
    name: Test (license-free)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Set up active Python environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --active --locked --no-dev --extra dev --no-install-project

      - name: Run pure and project-owned tests
        run: |
          python -m pytest -v --junitxml=results.xml \
            tests/test_config_parsing.py \
            tests/test_connext_install.py \
            modules/01-operating-room/tests/test_arm_kinematics.py \
            modules/01-operating-room/tests/test_gamepad_input.py \
            modules/02-record-playback/tests/test_recording.py::test_test_recording_workspace_preserves_existing_operator_recording \
            tests/test_ui_mode.py \
            -m "not browser"

      - name: Report deferred licensed capabilities
        run: |
          {
            echo "## Capability results"
            echo ""
            echo "| Capability | Result |"
            echo "| --- | --- |"
            echo "| Pure logic/configuration | executed |"
            echo "| Licensed DDS/service integration | not run on pull-request code; runs after a trusted push to an integration branch |"
            echo "| Python DDS runtime/license smoke | not run in this license-free lane; runtime licensing is not claimed |"
            echo "| Browser visual smoke | not required in the license-free lane |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pull-request-test-results
          path: results.xml

  # This job receives the RTI license only on pushes to the selected branches
  # or release tags. Protect these refs before treating its result as a gate.
  # Never run fork/PR code with the secret.
  integration:
    name: Build & DDS Integration (trusted push)
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Verify licensed integration is authorized
        id: license_preflight
        env:
          RTI_LICENSE_FILE_B64: ${{ secrets.RTI_LICENSE_FILE }}
        run: |
          if [[ -z "$RTI_LICENSE_FILE_B64" ]]; then
            echo "::error::RTI_LICENSE_FILE is required for trusted DDS integration."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Select Connext patch
        run: |
          version=$(python3 -c 'from tools.medtech.check_connext_install import project_python_api_version; print(project_python_api_version())')
          case "$version" in
            "${CONNEXT_VERSION}") patch="${version}.0" ;;
            "${CONNEXT_VERSION}".*) patch="$version" ;;
            *) echo "::error::CONNEXT_VERSION does not match pyproject.toml"; exit 1 ;;
          esac
          echo "CONNEXT_PATCH_VERSION=$patch" >> "$GITHUB_ENV"

      - name: Cache Connext installation
        id: cache-connext
        uses: actions/cache@v5
        with:
          path: /opt/rti.com
          key: connext-${{ env.CONNEXT_PATCH_VERSION }}-${{ runner.arch }}-apt-v4

      - name: Add RTI apt repository
        if: steps.cache-connext.outputs.cache-hit != 'true'
        run: |
          sudo curl -sSL -o /usr/share/keyrings/rti-official-archive.gpg \
            https://packages.rti.com/deb/official/repo.key
          printf "deb [arch=%s, signed-by=%s] %s %s main\n" \
            $(dpkg --print-architecture) \
            /usr/share/keyrings/rti-official-archive.gpg \
            https://packages.rti.com/deb/official \
            $(. /etc/os-release && echo ${VERSION_CODENAME}) | \
            sudo tee /etc/apt/sources.list.d/rti-official.list >/dev/null
          sudo apt-get update

      - name: Install Connext via apt
        if: steps.cache-connext.outputs.cache-hit != 'true'
        run: |
          echo "rti-connext-dds-${{ env.CONNEXT_VERSION }}-common rti-connext-dds-${{ env.CONNEXT_VERSION }}/license/accepted select true" | \
            sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              "rti-connext-dds-${CONNEXT_VERSION}-lib-dev=${CONNEXT_PATCH_VERSION}-*" \
              "rti-connext-dds-${CONNEXT_VERSION}-rtiddsgen=${CONNEXT_PATCH_VERSION}-*" \
              "rti-connext-dds-${CONNEXT_VERSION}-services-all=${CONNEXT_PATCH_VERSION}-*"

      - name: Configure Connext build environment
        run: |
          NDDSHOME=/opt/rti.com/rti_connext_dds-${{ env.CONNEXT_VERSION }}
          CONNEXTDDS_ARCH=$(basename $(ls -d "$NDDSHOME"/lib/*/libnddscore.so | head -1 | xargs dirname))
          echo "NDDSHOME=$NDDSHOME" >> "$GITHUB_ENV"
          echo "CONNEXTDDS_ARCH=$CONNEXTDDS_ARCH" >> "$GITHUB_ENV"

      - name: Verify installation
        id: sdk
        run: |
          test -d "$NDDSHOME"
          test -f "$NDDSHOME/lib/$CONNEXTDDS_ARCH/libnddssecurity.so"
          ls "$NDDSHOME"/third_party/openssl-*/"$CONNEXTDDS_ARCH"/release/lib/libssl.so* | head -1
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/{microsoft-prod,azure-cli}.*
          sudo apt-get update
          sudo apt-get install -y \
            cmake

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Set up active Python environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.13.8
          uv sync --active --locked --no-dev --extra dev --no-install-project

      - name: Build project binaries
        run: |
          python medtech.py build -- \
            -DRTICONNEXTDDS_VERSION=${{ env.CONNEXT_VERSION }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -- --parallel 2

      - name: Generate security artifacts
        run: |
          python system/security/setup_security.py --force
          python system/security/setup_security.py --stage
          python modules/04-security-threat/security/setup_threat_security.py --force

      - name: Configure Connext runtime environment
        run: |
          OPENSSL_LIB=$(dirname $(ls "$NDDSHOME"/third_party/openssl-*/"$CONNEXTDDS_ARCH"/release/lib/libssl.so* 2>/dev/null | head -1) 2>/dev/null || true)
          LD_LIBRARY_PATH="$NDDSHOME/lib/$CONNEXTDDS_ARCH${OPENSSL_LIB:+:$OPENSSL_LIB}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "$NDDSHOME/bin" >> "$GITHUB_PATH"

      - name: Write license file
        id: license
        env:
          RTI_LICENSE_FILE_B64: ${{ secrets.RTI_LICENSE_FILE }}
        run: |
          RTI_LICENSE_FILE="$RUNNER_TEMP/rti_license.dat"
          printf '%s' "$RTI_LICENSE_FILE_B64" | base64 --decode > "$RTI_LICENSE_FILE"
          echo "RTI_LICENSE_FILE=$RTI_LICENSE_FILE" >> "$GITHUB_ENV"
          if [ ! -s "$RTI_LICENSE_FILE" ]; then
            echo "::error::RTI license decode produced an empty file."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Smoke-test licensed Python DDS runtime
        id: python-runtime
        run: |
          python tools/medtech/smoke_connext_runtime.py
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Verify required services
        id: services
        run: |
          test -x "$NDDSHOME/bin/rtirecordingservice"
          test -x "$NDDSHOME/bin/rtireplayservice"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install required browser prerequisites
        id: browser
        run: |
          python -m playwright install --no-shell chromium
          echo "status=available" >> "$GITHUB_OUTPUT"

      - name: Run full test suite against prepared outputs
        run: python -m pytest -v --junitxml=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: results.xml

      - name: Report integration capabilities
        if: always()
        env:
          LICENSE_AUTHORIZED: ${{ steps.license_preflight.outputs.available }}
          LICENSE_AVAILABLE: ${{ steps.license.outputs.available }}
          SDK_AVAILABLE: ${{ steps.sdk.outputs.available }}
          SERVICES_AVAILABLE: ${{ steps.services.outputs.available }}
          PYTHON_RUNTIME_SMOKE: ${{ steps.python-runtime.outputs.passed }}
          BROWSER_STATUS: ${{ steps.browser.outputs.status }}
        run: |
          {
            echo "## Capability results"
            echo ""
            echo "| Capability | Result |"
            echo "| --- | --- |"
            echo "| Trusted push context | yes |"
            echo "| RTI license secret preflight | ${LICENSE_AUTHORIZED:-failed or not reached} |"
            echo "| Connext SDK | ${SDK_AVAILABLE:-failed or not reached} |"
            echo "| RTI license file | ${LICENSE_AVAILABLE:-failed or not reached} |"
            echo "| Python DDS runtime/license smoke | ${PYTHON_RUNTIME_SMOKE:-failed or not reached} |"
            echo "| Recording/Replay Service | ${SERVICES_AVAILABLE:-failed or not reached} |"
            echo "| Required Playwright/Chromium prerequisites | ${BROWSER_STATUS:-failed or not reached} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: integration
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(
            "$TAG"
            --verify-tag
            --title "$TAG"
            --generate-notes
          )

          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh release create "${args[@]}"
